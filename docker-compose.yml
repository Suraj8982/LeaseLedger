# Local stand-ins for the AWS services the app uses. Requires Docker.
#   docker compose up -d
services:
  # Emulates AWS S3 on http://localhost:4566 so photo upload works with no AWS account.
  # Pinned to a version that needs no sign-up or licence key.
  localstack:
    image: localstack/localstack:3.8.1
    environment:
      SERVICES: s3
    ports:
      - "4566:4566"
    volumes:
      # Scripts in this folder run once the emulator is ready: they create the bucket.
      - ./localstack:/etc/localstack/init/ready.d

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: leaseledger
      POSTGRES_USER: leaseledger
      POSTGRES_PASSWORD: leaseledger
    ports:
      - "5432:5432"
    volumes:
      - leaseledger-pgdata:/var/lib/postgresql/data

volumes:
  leaseledger-pgdata:
